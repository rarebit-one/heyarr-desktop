name: desktop

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      # Skiko dlopens these even when rendering off-screen.
      - name: Skia runtime libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libfontconfig1 libx11-6 libxrender1 libxtst6 libxi6

      - name: Build + JVM unit tests
        run: ./gradlew build --no-daemon --stacktrace

      - name: Screenshots (off-screen, fixture data)
        run: ./gradlew :composeApp:screenshots --no-daemon
        env:
          JAVA_TOOL_OPTIONS: -Djava.awt.headless=true

      - name: Upload screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: heyarr-desktop-screenshots
          path: composeApp/build/screenshots/*.png
          if-no-files-found: warn

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: heyarr-desktop-test-reports
          path: composeApp/build/reports/tests/**
          if-no-files-found: ignore
